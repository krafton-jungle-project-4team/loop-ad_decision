<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">HNSW candidate retrieval scale transition at 750K and 1M users</title>
  <desc id="desc">Grouped bars compare Exact and HNSW p95 latency for warm and database-cold runs. HNSW is faster in warm runs at both cohort sizes, fails the database-cold gate at 750K, and passes at 1M.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14211d; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b66; }
      .panel-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14211d; }
      .panel-note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b66; }
      .axis { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #71807a; }
      .group { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14211d; }
      .value { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14211d; }
      .legend { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34433e; }
      .badge { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .summary { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #063f38; }
      .summary-note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #315b54; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f7faf8"/>
  <text class="title" x="50" y="52">HNSW candidate retrieval: measured scale transition</text>
  <text class="subtitle" x="50" y="82">funnel_recovery - Top-500 - ef_search=200 - relaxed order - max_scan_tuples=20K</text>

  <rect x="50" y="112" width="535" height="450" rx="12" fill="#ffffff" stroke="#d6dfdb"/>
  <text class="panel-title" x="78" y="148">Warm-cache p95</text>
  <text class="panel-note" x="78" y="174">300 confirmation runs per plan</text>

  <line x1="90" y1="470" x2="545" y2="470" stroke="#b9c6c1"/>
  <line x1="90" y1="382" x2="545" y2="382" stroke="#e4eae7"/>
  <line x1="90" y1="294" x2="545" y2="294" stroke="#e4eae7"/>
  <line x1="90" y1="206" x2="545" y2="206" stroke="#e4eae7"/>
  <text class="axis" x="82" y="474" text-anchor="end">0</text>
  <text class="axis" x="82" y="386" text-anchor="end">40</text>
  <text class="axis" x="82" y="298" text-anchor="end">80</text>
  <text class="axis" x="82" y="210" text-anchor="end">120 ms</text>

  <rect x="145" y="291.5" width="54" height="178.5" rx="4" fill="#6e7b76"/>
  <rect x="205" y="453.0" width="54" height="17.0" rx="4" fill="#0b8176"/>
  <text class="value" x="172" y="282" text-anchor="middle">81.15</text>
  <text class="value" x="232" y="444" text-anchor="middle">7.73</text>
  <text class="group" x="202" y="505" text-anchor="middle">750K</text>
  <rect x="167" y="518" width="70" height="24" rx="12" fill="#dff4ef"/>
  <text class="badge" x="202" y="535" text-anchor="middle" fill="#087166">10.5x</text>

  <rect x="360" y="220.9" width="54" height="249.1" rx="4" fill="#6e7b76"/>
  <rect x="420" y="454.7" width="54" height="15.3" rx="4" fill="#0b8176"/>
  <text class="value" x="387" y="211" text-anchor="middle">113.20</text>
  <text class="value" x="447" y="446" text-anchor="middle">6.94</text>
  <text class="group" x="417" y="505" text-anchor="middle">1M</text>
  <rect x="380" y="518" width="74" height="24" rx="12" fill="#dff4ef"/>
  <text class="badge" x="417" y="535" text-anchor="middle" fill="#087166">16.3x</text>

  <rect x="615" y="112" width="535" height="450" rx="12" fill="#ffffff" stroke="#d6dfdb"/>
  <text class="panel-title" x="643" y="148">Database-cold p95</text>
  <text class="panel-note" x="643" y="174">30 confirmation runs per plan</text>

  <line x1="655" y1="470" x2="1110" y2="470" stroke="#b9c6c1"/>
  <line x1="655" y1="382" x2="1110" y2="382" stroke="#e4eae7"/>
  <line x1="655" y1="294" x2="1110" y2="294" stroke="#e4eae7"/>
  <line x1="655" y1="206" x2="1110" y2="206" stroke="#e4eae7"/>
  <text class="axis" x="647" y="474" text-anchor="end">0</text>
  <text class="axis" x="647" y="386" text-anchor="end">40</text>
  <text class="axis" x="647" y="298" text-anchor="end">80</text>
  <text class="axis" x="647" y="210" text-anchor="end">120 ms</text>

  <rect x="710" y="293.2" width="54" height="176.8" rx="4" fill="#6e7b76"/>
  <rect x="770" y="260.9" width="54" height="209.1" rx="4" fill="#0b8176"/>
  <text class="value" x="737" y="284" text-anchor="middle">80.38</text>
  <text class="value" x="797" y="251" text-anchor="middle">95.03</text>
  <text class="group" x="767" y="505" text-anchor="middle">750K</text>
  <rect x="730" y="518" width="74" height="24" rx="12" fill="#fde8e5"/>
  <text class="badge" x="767" y="535" text-anchor="middle" fill="#a33a2e">FAIL</text>

  <rect x="925" y="181.7" width="54" height="288.3" rx="4" fill="#6e7b76"/>
  <rect x="985" y="408.1" width="54" height="61.9" rx="4" fill="#0b8176"/>
  <text class="value" x="952" y="172" text-anchor="middle">131.03</text>
  <text class="value" x="1012" y="399" text-anchor="middle">28.13</text>
  <text class="group" x="982" y="505" text-anchor="middle">1M</text>
  <rect x="947" y="518" width="70" height="24" rx="12" fill="#dff4ef"/>
  <text class="badge" x="982" y="535" text-anchor="middle" fill="#087166">PASS</text>

  <rect x="50" y="580" width="1100" height="86" rx="12" fill="#e5f4f0" stroke="#b6d8d0"/>
  <text class="summary" x="76" y="615">750K showed a warm speedup; 1M was the first confirmed warm + database-cold crossover.</text>
  <text class="summary-note" x="76" y="642">Recall@500 = 0.988 - aggregate Wilson lower bound = 0.9741 - candidate-retrieval scope only</text>

  <rect x="872" y="42" width="16" height="16" rx="2" fill="#6e7b76"/>
  <text class="legend" x="896" y="55">Exact</text>
  <rect x="970" y="42" width="16" height="16" rx="2" fill="#0b8176"/>
  <text class="legend" x="994" y="55">HNSW</text>
</svg>
